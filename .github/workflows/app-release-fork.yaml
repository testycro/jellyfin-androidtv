name: App / Release (fork)

# Manual build of a signed release APK (minified, optimized) for the fork.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_B64       base64 of your keystore file
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
      - name: Assemble release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk
